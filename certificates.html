<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates - Shamique Khan</title>
    <link rel="stylesheet" href="style-modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Header */
        .cert-page-header {
            background: var(--white);
            padding: 2.5rem 3rem;
            border-bottom: 1px solid var(--cream);
        }

        .cert-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            color: var(--red);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: gap 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .cert-back-btn:hover {
            gap: 1.2rem;
        }

        .cert-page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 6rem;
            color: var(--red);
            line-height: 0.9;
            margin-bottom: 1rem;
        }

        .cert-page-subtitle {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--gray);
            max-width: 700px;
        }

        /* Filter Section */
        .cert-filter-section {
            background: var(--cream);
            padding: 2rem 3rem;
            text-align: center;
        }

        .cert-filter-btn {
            background: transparent;
            border: none;
            color: var(--gray);
            padding: 0.75rem 1.5rem;
            margin: 0 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .cert-filter-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: var(--red);
            transition: width 0.3s ease;
        }

        .cert-filter-btn:hover,
        .cert-filter-btn.active {
            color: var(--red);
        }

        .cert-filter-btn.active::after {
            width: 80%;
        }

        /* Certificates Grid */
        .cert-main-content {
            background: var(--white);
            padding: 3rem;
            min-height: 100vh;
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .cert-item {
            background: var(--cream);
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        .cert-item:hover {
            border-left-color: var(--red);
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(139, 26, 26, 0.1);
        }

        .cert-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .cert-info {
            padding: 1.5rem;
        }

        .cert-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--black);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .cert-issuer {
            font-size: 0.9rem;
            color: var(--red);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .cert-category {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--gray);
            background: var(--white);
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* Modal */
        .cert-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
        }

        .cert-modal.active {
            display: flex;
        }

        .cert-modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .cert-modal-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 3rem;
            color: white;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .cert-modal-close:hover {
            color: var(--red);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cert-page-title {
                font-size: 4rem;
            }

            .cert-grid {
                grid-template-columns: 1fr;
            }

            .cert-filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <section class="cert-page-header">
        <a href="index-final.html" class="cert-back-btn">
            <i class="fas fa-arrow-left"></i> BACK TO PORTFOLIO
        </a>
        <h1 class="cert-page-title">CERTIFICATES<br>& CREDENTIALS</h1>
        <p class="cert-page-subtitle">
            A comprehensive collection of professional certifications spanning AI/ML, Data Science, Cloud Computing, and Business Innovation. Each credential represents a commitment to continuous learning and mastery in cutting-edge technologies.
        </p>
    </section>

    <!-- Filter Section -->
    <section class="cert-filter-section">
        <button class="cert-filter-btn active" onclick="filterCerts('all')">ALL</button>
        <button class="cert-filter-btn" onclick="filterCerts('ai-ml')">AI & ML</button>
        <button class="cert-filter-btn" onclick="filterCerts('data-science')">DATA SCIENCE</button>
        <button class="cert-filter-btn" onclick="filterCerts('cloud')">CLOUD & TECH</button>
        <button class="cert-filter-btn" onclick="filterCerts('business')">BUSINESS</button>
    </section>

    <!-- Certificates Grid -->
    <section class="cert-main-content">
        <div class="cert-grid" id="certGrid">
            <!-- Certificates will be populated here by JavaScript -->
        </div>
    </section>

    <!-- Modal -->
    <div id="certModal" class="cert-modal" onclick="closeModal()">
        <span class="cert-modal-close">&times;</span>
        <img class="cert-modal-content" id="modalImage">
    </div>

    <script>
        // Certificate data
        const certificates = [
            { img: 'CS50AI shamique Khan_page-0001.jpg', title: 'CS50 AI with Python', issuer: 'Harvard University', category: 'ai-ml' },
            { img: 'AppliedAILabDeepLearningforComputerVision20251220-32-d44vj7_page-0001.jpg', title: 'Deep Learning for Computer Vision', issuer: 'WorldQuant University', category: 'ai-ml' },
            { img: 'IBM Data Science Professional Certificate_page-0001.jpg', title: 'Data Science Professional', issuer: 'IBM', category: 'data-science' },
            { img: 'eCertificate_page-0001.jpg', title: 'Oracle Cloud Infrastructure 2025 Certified Generative AI Professional', issuer: 'Oracle', category: 'ai-ml' },
            { img: 'AppliedAILabNaturalLanguageProcessing20251220-32-1pphz5f_page-0001.jpg', title: 'Natural Language Processing', issuer: 'Applied AI Lab', category: 'ai-ml' },
            { img: 'AppliedAILabRAG20251220-32-155u5gc_page-0001.jpg', title: 'Retrieval-Augmented Generation (RAG)', issuer: 'Applied AI Lab', category: 'ai-ml' },
            { img: 'McKinsey Forward Program_page-0001.jpg', title: 'McKinsey Forward Program', issuer: 'McKinsey & Company', category: 'business' },
            { img: 'Google Startup School_page-0001.jpg', title: 'AI Startup School', issuer: 'Google for Startups', category: 'business' },
            { img: 'Certificate_8534880680_07012026022317.pdf', title: 'SEBI Investor Awareness Test', issuer: 'Securities and Exchange Board of India', category: 'business' },
            { img: 'Yale certificate.pdf', title: 'Creating Change through Social Entrepreneurship', issuer: 'Yale University', category: 'business' },
            { img: 'Certificate-Diving-into-Radical-Creativity .pdf', title: 'Diving into Radical Creativity', issuer: 'Aalto University', category: 'business' },
            { img: 'German_Language_Course_Completion_German_Language_(2025_Edition)_KHAN.png', title: 'German Language Course', issuer: 'American University', category: 'business' },
            { img: 'Coursera Certificate', title: 'MBA Essentials', issuer: 'University of Glasgow', category: 'business' },
            { img: 'Machine Learning Algorithms Certification.pdf', title: 'Machine Learning Algorithms: Supervised Learning', issuer: 'Amii (Alberta Machine Intelligence Institute)', category: 'ai-ml' },
            { img: 'NLP in TensorFlow', title: 'Natural Language Processing in TensorFlow', issuer: 'DeepLearning.AI', category: 'ai-ml' },
            { img: 'prepare-data-for-ml-apis-on-google-cloud-skill-badge', title: 'Prepare Data for ML APIs on Google Cloud', issuer: 'Google', category: 'cloud' },
            { img: 'Coursera rag certification.pdf', title: 'RAG with Embeddings & Vector Databases', issuer: 'Coursera', category: 'ai-ml' },
            { img: 'Generative AI: Elevate Your Data Science Career Certificate', title: 'Generative AI: Elevate Your Data Science Career', issuer: 'IBM', category: 'ai-ml' },
            { img: 'Blockchain and Cryptocurrency Certificate', title: 'Blockchain and Cryptocurrency Explained', issuer: 'University of Michigan', category: 'cloud' },
            { img: 'Shamique Khan - Intermediate Machine Learning.png', title: 'Intermediate Machine Learning', issuer: 'Kaggle', category: 'ai-ml' },
            { img: 'Shamique Khan - Intro to Machine Learning.png', title: 'Intro to Machine Learning', issuer: 'Kaggle', category: 'ai-ml' },
            { img: 'Introduction to Large Language Models Certificate', title: 'Introduction to Large Language Models', issuer: 'Google Cloud', category: 'ai-ml' },
            { img: 'Coursera AI for Everyone Certificate', title: 'AI For Everyone', issuer: 'DeepLearning.AI', category: 'ai-ml' },
            { img: 'Nvidia AI Intra and Operations Fundamentals', title: 'AI Infrastructure and Operations Fundamentals', issuer: 'NVIDIA', category: 'cloud' },
            { img: 'IIT Ropar Gen AI HacKathon Participation Certificate', title: 'Gen AI Hackathon Participation', issuer: 'IIT Ropar', category: 'ai-ml' },
            { img: 'Fundamentals of Finance UCI', title: 'Fundamentals of Finance', issuer: 'UC Irvine', category: 'business' },
            { img: 'Investment Banking Certificate', title: 'J.P. Morgan Investment Banking Job Simulation', issuer: 'Forage', category: 'business' },
            { img: 'Machine learning For all', title: 'Machine Learning for All', issuer: 'University of London', category: 'ai-ml' },
            { img: 'IBM Machine Learning Certificate', title: 'Machine Learning with Python', issuer: 'IBM', category: 'ai-ml' },
            { img: 'MongoDB Basics', title: 'MongoDB Basics for Students', issuer: 'MongoDB', category: 'cloud' },
            { img: 'Data Analysis With Python Certificate', title: 'Data Analysis with Python', issuer: 'IBM', category: 'data-science' },
            { img: 'Data visualization with python Certificate', title: 'Data Visualization with Python', issuer: 'IBM', category: 'data-science' },
            { img: 'Database and SQL certificate', title: 'Databases and SQL for Data Science', issuer: 'IBM', category: 'data-science' },
            { img: 'Introduction To Responsible AI Certificate', title: 'Introduction to Responsible AI', issuer: 'Google Cloud Security', category: 'ai-ml' },
            { img: 'Python Essentials', title: 'Python Essentials', issuer: 'Vityarthi', category: 'data-science' },
            { img: 'Coursera Python For Data science Ai .pdf', title: 'Python for Data Science, AI & Development', issuer: 'IBM', category: 'data-science' },
            { img: 'artificial-intelligence-fundamentals', title: 'Artificial Intelligence Fundamentals', issuer: 'IBM', category: 'ai-ml' },
            { img: 'Google Analytics Certification', title: 'Google Analytics Certification', issuer: 'Google Digital Academy', category: 'data-science' },
            { img: 'Prompt Engineering & Programming with OpenAI', title: 'Prompt Engineering & Programming with OpenAI', issuer: 'Columbia+', category: 'ai-ml' },
            { img: 'Python Essentials 1 Certificate', title: 'Python Essentials 1', issuer: 'Cisco', category: 'data-science' },
            { img: 'Python Essentials 2', title: 'Python Essentials 2', issuer: 'Cisco', category: 'data-science' },
            { img: 'MCP Server Certificate', title: 'YouTube Labs - MCP', issuer: 'KodeKloud', category: 'cloud' },
            { img: 'Data Analysis Job Simulation', title: 'Deloitte Australia Data Analytics Job Simulation', issuer: 'Forage', category: 'data-science' },
            { img: 'Version controls And Gits Infosys Cources Certificate', title: 'Hands-On Version Control with Git', issuer: 'Infosys Springboard', category: 'cloud' },
            { img: 'Python Infosys Cources Certificate', title: 'Mastering Python', issuer: 'Infosys Springboard', category: 'data-science' },
            { img: 'HTML & CSS Infosys Cources Certificate', title: 'Designing a Company Website using HTML & CSS', issuer: 'Infosys Springboard', category: 'cloud' },
            { img: 'Java Infosys Cources Certificate', title: 'Java Features', issuer: 'Infosys Springboard', category: 'data-science' },
            { img: 'Intermediate German Certificate', title: 'Intermediate German: The world of work', issuer: 'The Open University', category: 'business' }
        ];

        // Render certificates
        function renderCertificates(filter = 'all') {
            const grid = document.getElementById('certGrid');
            grid.innerHTML = '';

            const filtered = filter === 'all' 
                ? certificates 
                : certificates.filter(cert => cert.category === filter);

            filtered.forEach(cert => {
                const certCard = document.createElement('div');
                certCard.className = 'cert-item';
                certCard.setAttribute('data-category', cert.category);
                certCard.innerHTML = `
                    <img src="certificates/${cert.img}" alt="${cert.title}" onclick="openModal('certificates/${cert.img}')">
                    <div class="cert-info">
                        <h3 class="cert-title">${cert.title}</h3>
                        <p class="cert-issuer">${cert.issuer}</p>
                        <span class="cert-category">${cert.category.replace('-', ' & ').toUpperCase()}</span>
                    </div>
                `;
                grid.appendChild(certCard);
            });
        }

        // Filter certificates
        function filterCerts(category) {
            const buttons = document.querySelectorAll('.cert-filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCertificates(category);
        }

        // Modal functions
        function openModal(src) {
            const modal = document.getElementById('certModal');
            const modalImg = document.getElementById('modalImage');
            modal.classList.add('active');
            modalImg.src = src;
        }

        function closeModal() {
            document.getElementById('certModal').classList.remove('active');
        }

        // Close modal on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Initialize
        renderCertificates();
    </script>

</body>
</html>
